
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracking System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 25px;
            color: #1f2937;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            margin: 8px 5px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.88;
        }

        .add-button {
            width: 100%;
            background: #2563eb;
            color: white;
            margin-top: 18px;
            padding: 12px;
        }

        .sound-button {
            display: block;
            margin: 15px auto;
            background: #111827;
            color: white;
        }

        .bug {
            background: #f2f5f9;
            padding: 16px;
            margin-top: 14px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow-wrap: anywhere;
        }

        .bug.critical {
            background: #fff0f0;
            border: 1px solid #fecaca;
            border-left: 6px solid #dc2626;
        }

        .bug.high {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-left: 6px solid #f97316;
        }

        .bug.medium {
            background: #fefce8;
            border-left: 6px solid #eab308;
        }

        .bug.low {
            background: #f0fdf4;
            border-left: 6px solid #16a34a;
        }

        .critical-text {
            color: #dc2626;
            font-weight: bold;
            font-size: 17px;
        }

        .high-text {
            color: #c2410c;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 4px 8px;
            border-radius: 5px;
            font-weight: bold;
        }

        .update-button {
            background: #2563eb;
            color: white;
        }

        .delete-button {
            background: #dc2626;
            color: white;
        }

        #alertBanner {
            display: none;
            background: #dc2626;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            padding: 18px;
            margin: 15px 0;
            border-radius: 8px;
            animation: pulse 0.7s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.65; }
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

        .empty-message {
            color: #64748b;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>🐞 Bug Tracking System</h1>
    <p style="text-align:center;">
        Report, track, and manage software bugs.
    </p>

    <button type="button" id="soundButton" class="sound-button">
        🔔 Enable Sound
    </button>

    <div id="alertBanner" role="alert" aria-live="assertive">
        🚨 CRITICAL BUG DETECTED! 🚨
    </div>

    <h2>Report a New Bug</h2>

    <form id="bugForm">
        <label for="title">Bug Title</label>
        <input type="text" id="title"
               placeholder="Enter bug title" required>

        <label for="description">Description</label>
        <textarea id="description"
                  placeholder="Describe the bug" required></textarea>

        <label for="priority">Priority</label>
        <select id="priority" required>
            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>
            <option value="CRITICAL">CRITICAL</option>
        </select>

        <button type="submit" class="add-button">
            ➕ Add Bug
        </button>
    </form>

    <p id="message" role="status"></p>

    <h2>Reported Bugs</h2>
    <div id="bugs">
        <p class="empty-message">Loading bugs...</p>
    </div>
</div>

<script>
    const API_URL = "/api/bugs";

    let soundEnabled = false;
    let audioContext = null;
    let bannerTimer = null;

    const bugForm = document.getElementById("bugForm");
    const bugsContainer = document.getElementById("bugs");
    const message = document.getElementById("message");
    const soundButton = document.getElementById("soundButton");
    const alertBanner = document.getElementById("alertBanner");

    // Enable or mute sound. Browsers require a user interaction.
    soundButton.addEventListener("click", async function () {
        try {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) {
                alert("Your browser does not support audio playback.");
                return;
            }

            if (!audioContext) {
                audioContext = new AudioContextClass();
            }

            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }

            soundEnabled = !soundEnabled;

            if (soundEnabled) {
                soundButton.textContent = "🔇 Mute Sound";
                playPrioritySound("LOW"); // Short test tone
            } else {
                soundButton.textContent = "🔔 Enable Sound";
            }
        } catch (error) {
            console.error("Could not enable sound:", error);
            alert("Could not enable sound. Check your browser settings.");
        }
    });

    // Play a sound pattern for exactly five seconds.
    function playPrioritySound(priority) {
        if (!soundEnabled || !audioContext) return;

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        let frequency;
        let volume;
        let beepDuration;
        let interval;

        switch (priority) {
            case "CRITICAL":
                frequency = 880;
                volume = 0.25;
                beepDuration = 0.45;
                interval = 0.5;
                break;

            case "HIGH":
                frequency = 660;
                volume = 0.20;
                beepDuration = 0.18;
                interval = 0.30;
                break;

            case "MEDIUM":
                frequency = 520;
                volume = 0.15;
                beepDuration = 0.25;
                interval = 0.65;
                break;

            case "LOW":
                frequency = 360;
                volume = 0.08;
                beepDuration = 0.15;
                interval = 1.0;
                break;

            default:
                return;
        }

        const startTime = audioContext.currentTime;
        const totalDuration = 5;

        for (let offset = 0; offset < totalDuration; offset += interval) {
            const duration = Math.min(
                beepDuration,
                totalDuration - offset
            );

            playToneAt(
                frequency,
                duration,
                volume,
                startTime + offset
            );
        }
    }

    // Create an individual scheduled beep.
    function playToneAt(frequency, duration, volume, startTime) {
        if (!soundEnabled || !audioContext) return;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        const endTime = startTime + duration;

        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(frequency, startTime);

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
        gain.gain.setValueAtTime(
            volume,
            Math.max(startTime + 0.02, endTime - 0.03)
        );
        gain.gain.linearRampToValueAtTime(0, endTime);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(startTime);
        oscillator.stop(endTime);
    }

    // Display the Critical alert for five seconds.
    function showCriticalAlert() {
        alertBanner.style.display = "block";

        if (bannerTimer) {
            clearTimeout(bannerTimer);
        }

        bannerTimer = setTimeout(function () {
            alertBanner.style.display = "none";
        }, 5000);
    }

    // Load bugs from the Spring Boot REST API.
    async function loadBugs() {
        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Could not load bugs.");
            }

            const bugs = await response.json();
            bugsContainer.replaceChildren();

            if (!Array.isArray(bugs) || bugs.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-message";
                empty.textContent = "No bugs reported yet.";
                bugsContainer.appendChild(empty);
                return;
            }

            bugs.forEach(function (bug) {
                const priority = String(bug.priority || "LOW").toUpperCase();
                const status = String(bug.status || "OPEN").toUpperCase();

                const card = document.createElement("div");
                card.className = "bug";

                if (["CRITICAL", "HIGH", "MEDIUM", "LOW"].includes(priority)) {
                    card.classList.add(priority.toLowerCase());
                }

                const heading = document.createElement("h3");
                heading.textContent =
                    "#" + bug.id + " - " + (bug.title || "Untitled bug");

                if (priority === "CRITICAL") {
                    heading.className = "critical-text";
                    heading.textContent =
                        "🚨 CRITICAL BUG 🚨 | " + heading.textContent;
                } else if (priority === "HIGH") {
                    heading.className = "high-text";
                }

                const description = document.createElement("p");
                description.textContent =
                    bug.description || "No description provided.";

                const priorityLine = document.createElement("p");
                priorityLine.textContent = "Priority: " + priority;

                const statusLine = document.createElement("p");
                statusLine.appendChild(document.createTextNode("Status: "));

                const statusBadge = document.createElement("span");
                statusBadge.className = "status";
                statusBadge.textContent = status;
                statusLine.appendChild(statusBadge);

                const updateButton = document.createElement("button");
                updateButton.className = "update-button";
                updateButton.textContent = "✅ Mark Resolved";
                updateButton.addEventListener("click", function () {
                    updateBugStatus(bug);
                });

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.textContent = "🗑️ Delete";
                deleteButton.addEventListener("click", function () {
                    deleteBug(bug.id);
                });

                card.append(
                    heading,
                    description,
                    priorityLine,
                    statusLine,
                    updateButton,
                    deleteButton
                );

                bugsContainer.appendChild(card);
            });
        } catch (error) {
            console.error(error);
            bugsContainer.textContent =
                "Could not load bugs. Check that the application is running.";
        }
    }

    // Create a bug and play its priority sound.
    bugForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const bug = {
            title: document.getElementById("title").value.trim(),
            description: document.getElementById("description").value.trim(),
            priority: document.getElementById("priority").value
        };

        if (!bug.title || !bug.description) {
            message.textContent = "Please enter a title and description.";
            message.style.color = "red";
            return;
        }

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bug)
            });

            if (!response.ok) {
                throw new Error("Failed to create bug.");
            }

            message.textContent = "Bug added successfully!";
            message.style.color = "green";

            bugForm.reset();

            if (bug.priority === "CRITICAL") {
                showCriticalAlert();
            }

            playPrioritySound(bug.priority);

            await loadBugs();
        } catch (error) {
            console.error(error);
            message.textContent =
                "Could not add the bug. Please try again.";
            message.style.color = "red";
        }
    });

    // Mark a bug as resolved.
    async function updateBugStatus(bug) {
        try {
            const updatedBug = {
                ...bug,
                status: "RESOLVED"
            };

            const response = await fetch(API_URL + "/" + bug.id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedBug)
            });

            if (!response.ok) {
                throw new Error("Failed to update bug.");
            }

            message.textContent = "Bug marked as resolved.";
            message.style.color = "green";

            await loadBugs();
        } catch (error) {
            console.error(error);
            message.textContent =
                "Could not update bug. Please try again.";
            message.style.color = "red";
        }
    }

    // Delete a bug.
    async function deleteBug(id) {
        if (!confirm("Are you sure you want to delete this bug?")) {
            return;
        }

        try {
            const response = await fetch(API_URL + "/" + id, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Failed to delete bug.");
            }

            message.textContent = "Bug deleted successfully.";
            message.style.color = "green";

            await loadBugs();
        } catch (error) {
            console.error(error);
            message.textContent =
                "Could not delete bug. Please try again.";
            message.style.color = "red";
        }
    }

    loadBugs();
</script>
</body>
</html>
